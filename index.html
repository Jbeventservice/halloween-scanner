<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<meta name="theme-color"
      content="#111111">

<title>JB Event Service</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

/* =================================================
   GRUNDLAYOUT
================================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #111111;
  color: #ffffff;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Helvetica Neue",
    Arial,
    sans-serif;
}

body {
  overflow-x: hidden;
}


/* =================================================
   SPLASH SCREEN
================================================= */

#splash {

  position: fixed;

  inset: 0;

  z-index: 9999;

  display: flex;

  flex-direction: column;

  justify-content: center;

  align-items: center;

  background:
    radial-gradient(
      circle at center,
      #303030 0%,
      #191919 45%,
      #0d0d0d 100%
    );

  transition:
    opacity 0.8s ease,
    visibility 0.8s ease;

}


#splash.hide {

  opacity: 0;

  visibility: hidden;

}


.splash-logo {

  width: 230px;

  max-width: 70vw;

  filter: invert(1);

  opacity: 0;

  transform:
    scale(0.92)
    translateY(10px);

  animation:
    logoIn 1.1s
    cubic-bezier(.2,.8,.2,1)
    forwards;

}


.splash-slogan {

  margin-top: 30px;

  font-size: 14px;

  letter-spacing: 3px;

  color: #cfcfcf;

  text-align: center;

  opacity: 0;

  animation:
    sloganIn 1s
    ease
    0.6s
    forwards;

}


@keyframes logoIn {

  to {

    opacity: 1;

    transform:
      scale(1)
      translateY(0);

  }

}


@keyframes sloganIn {

  to {

    opacity: 1;

  }

}


/* =================================================
   APP
================================================= */

#app {

  min-height: 100vh;

  padding:
    max(25px, env(safe-area-inset-top))
    20px
    max(25px, env(safe-area-inset-bottom))
    20px;

  opacity: 0;

  transform:
    translateY(15px);

  transition:
    opacity 0.8s ease,
    transform 0.8s ease;

}


#app.show {

  opacity: 1;

  transform:
    translateY(0);

}


.app-container {

  width: 100%;

  max-width: 520px;

  margin: auto;

}


/* =================================================
   HEADER
================================================= */

.header {

  display: flex;

  align-items: center;

  justify-content: space-between;

  margin-bottom: 24px;

}


.header-brand {

  display: flex;

  align-items: center;

  gap: 12px;

}


.header-logo {

  width: 55px;

  height: 55px;

  object-fit: contain;

  filter: invert(1);

}


.header-text {

  display: flex;

  flex-direction: column;

}


.brand-name {

  font-size: 14px;

  font-weight: 600;

  letter-spacing: 2px;

}


.brand-sub {

  margin-top: 3px;

  font-size: 11px;

  color: #888;

  letter-spacing: 1px;

}


.live-indicator {

  display: flex;

  align-items: center;

  gap: 7px;

  padding:
    8px
    11px;

  border-radius: 30px;

  background:
    rgba(255,255,255,0.06);

  border:
    1px solid
    rgba(255,255,255,0.08);

  color: #aaa;

  font-size: 10px;

  letter-spacing: 1px;

}


.live-dot {

  width: 7px;

  height: 7px;

  border-radius: 50%;

  background: #6ee7a0;

  box-shadow:
    0 0 10px
    rgba(110,231,160,.7);

}


/* =================================================
   EVENT CARD
================================================= */

.event-card {

  position: relative;

  overflow: hidden;

  padding: 25px;

  border-radius: 25px;

  background:
    linear-gradient(
      145deg,
      #292929,
      #181818
    );

  border:
    1px solid
    rgba(255,255,255,0.08);

  box-shadow:
    0 20px 50px
    rgba(0,0,0,.35);

  margin-bottom: 20px;

}


.event-card::after {

  content: "";

  position: absolute;

  width: 180px;

  height: 180px;

  right: -80px;

  top: -80px;

  border-radius: 50%;

  background:
    rgba(255,255,255,.035);

}


.event-small {

  font-size: 10px;

  color: #999;

  letter-spacing: 3px;

  text-transform: uppercase;

}


.event-title {

  margin-top: 9px;

  font-size: 29px;

  font-weight: 700;

  letter-spacing: -0.8px;

}


.event-subtitle {

  margin-top: 6px;

  font-size: 13px;

  color: #aaa;

}


/* =================================================
   SCANNER CARD
================================================= */

.scanner-card {

  padding: 12px;

  border-radius: 27px;

  background:
    #1b1b1b;

  border:
    1px solid
    rgba(255,255,255,.08);

  box-shadow:
    0 25px 60px
    rgba(0,0,0,.35);

}


#reader {

  width: 100%;

  min-height: 280px;

  overflow: hidden;

  border-radius: 20px;

  background: #0c0c0c;

}


#reader video {

  width: 100% !important;

  height: auto !important;

  border-radius: 20px;

}


#reader img {

  display: none !important;

}


/* =================================================
   SCANNER HINWEIS
================================================= */

.scanner-hint {

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 8px;

  padding: 14px 5px 5px;

  color: #777;

  font-size: 11px;

}


.scanner-hint-dot {

  width: 5px;

  height: 5px;

  background: #777;

  border-radius: 50%;

}


/* =================================================
   MANUELLE EINGABE
================================================= */

.manual-card {

  margin-top: 20px;

  padding: 20px;

  border-radius: 22px;

  background:
    linear-gradient(
      145deg,
      #232323,
      #171717
    );

  border:
    1px solid
    rgba(255,255,255,.07);

  box-shadow:
    0 15px 40px
    rgba(0,0,0,.25);

}


.input-label {

  margin-bottom: 10px;

  font-size: 11px;

  color: #888;

  letter-spacing: 1.5px;

  text-transform: uppercase;

}


input {

  width: 100%;

  height: 54px;

  padding:
    0
    16px;

  border:
    1px solid
    #333;

  border-radius: 15px;

  outline: none;

  background:
    #101010;

  color: #ffffff;

  font-size: 15px;

  font-family:
    monospace;

  transition:
    border .2s ease,
    box-shadow .2s ease;

}


input:focus {

  border-color:
    #777;

  box-shadow:
    0 0 0 3px
    rgba(255,255,255,.04);

}


input::placeholder {

  color: #555;

}


/* =================================================
   BUTTON
================================================= */

.main-button {

  width: 100%;

  height: 56px;

  margin-top: 12px;

  border: none;

  border-radius: 15px;

  background:
    linear-gradient(
      135deg,
      #eeeeee,
      #bdbdbd
    );

  color: #111;

  font-size: 14px;

  font-weight: 700;

  letter-spacing: 1px;

  cursor: pointer;

  box-shadow:
    0 10px 25px
    rgba(0,0,0,.3);

  transition:
    transform .15s ease,
    box-shadow .15s ease;

}


.main-button:active {

  transform:
    scale(.98);

  box-shadow:
    0 5px 15px
    rgba(0,0,0,.25);

}


/* =================================================
   STATUS
================================================= */

.status {

  margin-top: 20px;

  padding: 25px;

  border-radius: 23px;

  text-align: center;

  background:
    linear-gradient(
      145deg,
      #242424,
      #171717
    );

  border:
    1px solid
    rgba(255,255,255,.07);

  box-shadow:
    0 20px 45px
    rgba(0,0,0,.3);

  animation:
    statusIn .35s ease;

}


@keyframes statusIn {

  from {

    opacity: 0;

    transform:
      translateY(10px);

  }

  to {

    opacity: 1;

    transform:
      translateY(0);

  }

}


.status-icon {

  width: 64px;

  height: 64px;

  margin:
    0
    auto
    15px;

  display: flex;

  align-items: center;

  justify-content: center;

  border-radius: 50%;

  font-size: 29px;

}


.status-valid {

  border:
    1px solid
    rgba(110,231,160,.4);

  background:
    rgba(110,231,160,.08);

}


.status-invalid {

  border:
    1px solid
    rgba(255,90,90,.4);

  background:
    rgba(255,90,90,.08);

}


.status-used {

  border:
    1px solid
    rgba(255,190,70,.4);

  background:
    rgba(255,190,70,.08);

}


.status-title {

  font-size: 23px;

  font-weight: 700;

}


.status-info {

  margin-top: 12px;

  color: #aaa;

  line-height: 1.7;

  font-size: 14px;

}


.status-name {

  color: #fff;

  font-size: 19px;

  font-weight: 600;

}


.ticket-id {

  margin-top: 12px;

  padding: 9px;

  border-radius: 10px;

  background:
    rgba(0,0,0,.3);

  color: #aaa;

  font-family: monospace;

  font-size: 12px;

}


/* =================================================
   FOOTER
================================================= */

.footer {

  margin-top: 30px;

  text-align: center;

  color: #555;

  font-size: 10px;

  letter-spacing: 1.5px;

}


/* =================================================
   MOBILE
================================================= */

@media (
  max-width: 380px
) {

  .event-title {

    font-size: 25px;

  }

  .event-card {

    padding: 21px;

  }

}

</style>

</head>


<body>


<!-- =================================================
     SPLASH
================================================= -->

<div id="splash">

  <img
    src="IMG_2752.jpeg"
    class="splash-logo"
    alt="JB Event Service"
  >

  <div class="splash-slogan">

    DEIN EVENT. UNSER SERVICE.

  </div>

</div>


<!-- =================================================
     APP
================================================= -->

<div id="app">

<div class="app-container">


  <!-- HEADER -->

  <div class="header">

    <div class="header-brand">

      <img
        src="IMG_2752.jpeg"
        class="header-logo"
        alt="JB"
      >

      <div class="header-text">

        <div class="brand-name">
          JB EVENT SERVICE
        </div>

        <div class="brand-sub">
          EINLASS SYSTEM
        </div>

      </div>

    </div>


    <div class="live-indicator">

      <span class="live-dot"></span>

      LIVE

    </div>

  </div>


  <!-- EVENT -->

  <div class="event-card">

    <div class="event-small">
      EVENT
    </div>

    <div class="event-title">
      Halloween Party 2026
    </div>

    <div class="event-subtitle">
      Digitaler Einlass · JB Event Service
    </div>

  </div>


  <!-- SCANNER -->

  <div class="scanner-card">

    <div id="reader"></div>

    <div class="scanner-hint">

      <span class="scanner-hint-dot"></span>

      QR-Code vor die Kamera halten

    </div>

  </div>


  <!-- MANUELLE EINGABE -->

  <div class="manual-card">

    <div class="input-label">
      Alternative
    </div>

    <input
      id="manual"
      type="text"
      autocomplete="off"
      autocapitalize="characters"
      placeholder="Ticket-ID eingeben"
    >

    <button
      class="main-button"
      onclick="manualCheck()"
    >

      TICKET PRÜFEN

    </button>

  </div>


  <!-- STATUS -->

  <div id="status"></div>


  <!-- FOOTER -->

  <div class="footer">

    DEIN EVENT. UNSER SERVICE.

  </div>


</div>

</div>


<script>

/* =================================================
   GOOGLE APPS SCRIPT
================================================= */

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyiovw5TRgRqChipAvU5cIvCZ9wSLP69dfOvT_TtBagnDDLj8XjiwUSZERqKZSqQnHF/exec";


let scanner = null;

let locked = false;


/* =================================================
   SPLASH
================================================= */

window.addEventListener(
  "load",
  function() {

    setTimeout(
      function() {

        document
          .getElementById("splash")
          .classList
          .add("hide");

        document
          .getElementById("app")
          .classList
          .add("show");

      },
      2300
    );

  }
);


/* =================================================
   SCANNER STARTEN
================================================= */

function startScanner() {

  scanner =
    new Html5Qrcode(
      "reader"
    );


  scanner
    .start(

      {
        facingMode:
          "environment"
      },

      {
        fps: 10,

        qrbox: {
          width: 230,
          height: 230
        }
      },

      function(decodedText) {

        if (locked) {
          return;
        }

        locked = true;

        processQR(
          decodedText
        );

      },

      function() {

        // Scanner läuft weiter

      }

    )
    .catch(
      function() {

        document
          .getElementById("reader")
          .innerHTML = `

            <div style="
              height:280px;
              display:flex;
              align-items:center;
              justify-content:center;
              text-align:center;
              color:#777;
              padding:30px;
              font-size:13px;
            ">

              Kamera konnte nicht gestartet werden.<br>
              Bitte Kameraberechtigung prüfen.

            </div>

          `;

      }
    );

}


/* =================================================
   QR VERARBEITEN
================================================= */

function processQR(
  text
) {

  let ticketId =
    String(text)
      .trim();


  try {

    const url =
      new URL(text);

    const id =
      url.searchParams.get(
        "id"
      );

    if (id) {

      ticketId = id;

    }

  }
  catch(e) {

    // Direkte Ticket-ID

  }


  checkTicket(
    ticketId
  );

}


/* =================================================
   TICKET PRÜFEN
================================================= */

function checkTicket(
  ticketId
) {

  ticketId =
    String(ticketId || "")
      .trim()
      .toUpperCase();


  if (!ticketId) {

    showError(
      "Keine Ticket-ID erkannt."
    );

    return;

  }


  showLoading();


  const callbackName =
    "check_" +
    Date.now();


  window[callbackName] =
    function(ticket) {

      displayTicket(
        ticket
      );

      delete window[
        callbackName
      ];

    };


  const script =
    document.createElement(
      "script"
    );


  script.src =
    SCRIPT_URL +
    "?action=check" +
    "&id=" +
    encodeURIComponent(
      ticketId
    ) +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      delete window[
        callbackName
      ];

      showError(
        "Verbindung zum Ticketsystem fehlgeschlagen."
      );

    };


  document.body.appendChild(
    script
  );

}


/* =================================================
   TICKET ANZEIGEN
================================================= */

function displayTicket(
  ticket
) {


  if (!ticket.found) {

    showError(
      "TICKET NICHT GEFUNDEN"
    );

    return;

  }


  if (
    ticket.alreadyUsed
  ) {

    document
      .getElementById("status")
      .innerHTML = `

        <div class="status status-used">

          <div class="status-icon">
            ⚠️
          </div>

          <div class="status-title">
            BEREITS EINGELÖST
          </div>

          <div class="status-info">

            <div class="status-name">
              ${escapeHtml(
                ticket.name
              )}
            </div>

            ${escapeHtml(
              ticket.ticketType
            )}

          </div>

          <div class="ticket-id">

            ${escapeHtml(
              ticket.ticketId
            )}

          </div>

          <button
            class="main-button"
            onclick="resetScanner()"
          >

            NÄCHSTES TICKET

          </button>

        </div>

      `;

    return;

  }


  document
    .getElementById("status")
    .innerHTML = `

      <div class="status status-valid">

        <div class="status-icon">
          ✓
        </div>

        <div class="status-title">
          TICKET GÜLTIG
        </div>

        <div class="status-info">

          <div class="status-name">

            ${escapeHtml(
              ticket.name
            )}

          </div>

          ${escapeHtml(
            ticket.ticketType
          )}

          <br>

          ${Number(
            ticket.price
          ).toFixed(2)} €

        </div>

        <div class="ticket-id">

          ${escapeHtml(
            ticket.ticketId
          )}

        </div>

        <button
          class="main-button"
          onclick="redeemTicket(
            '${escapeJs(
              ticket.ticketId
            )}'
          )"
        >

          EINLASS GEWÄHREN

        </button>

      </div>

    `;

}


/* =================================================
   EINLASS
================================================= */

function redeemTicket(
  ticketId
) {

  showLoading();


  const callbackName =
    "redeem_" +
    Date.now();


  window[callbackName] =
    function(result) {

      if (
        result.success
      ) {

        document
          .getElementById("status")
          .innerHTML = `

            <div class="status status-valid">

              <div class="status-icon">
                ✓
              </div>

              <div class="status-title">
                EINLASS GEWÄHRT
              </div>

              <div class="status-info">

                <div class="status-name">

                  ${escapeHtml(
                    result.name
                  )}

                </div>

                ${escapeHtml(
                  result.ticketType
                )}

                <br><br>

                Ticket erfolgreich eingelöst.

              </div>

              <div class="ticket-id">

                ${escapeHtml(
                  result.ticketId
                )}

              </div>

              <button
                class="main-button"
                onclick="resetScanner()"
              >

                NÄCHSTES TICKET

              </button>

            </div>

          `;

      }
      else {

        showError(
          result.message ||
          "Ticket konnte nicht eingelöst werden."
        );

      }


      delete window[
        callbackName
      ];

    };


  const script =
    document.createElement(
      "script"
    );


  script.src =
    SCRIPT_URL +
    "?action=redeem" +
    "&id=" +
    encodeURIComponent(
      ticketId
    ) +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      delete window[
        callbackName
      ];

      showError(
        "Verbindung fehlgeschlagen."
      );

    };


  document.body.appendChild(
    script
  );

}


/* =================================================
   MANUELLE EINGABE
================================================= */

function manualCheck() {

  const value =
    document
      .getElementById("manual")
      .value;

  checkTicket(
    value
  );

}


/* =================================================
   LOADING
================================================= */

function showLoading() {

  document
    .getElementById("status")
    .innerHTML = `

      <div class="status">

        <div class="status-icon">
          …
        </div>

        <div class="status-title">
          TICKET WIRD GEPRÜFT
        </div>

        <div class="status-info">
          Einen Moment bitte …
        </div>

      </div>

    `;

}


/* =================================================
   FEHLER
================================================= */

function showError(
  message
) {

  document
    .getElementById("status")
    .innerHTML = `

      <div class="status status-invalid">

        <div class="status-icon">
          ×
        </div>

        <div class="status-title">
          ${escapeHtml(
            message
          )}
        </div>

        <button
          class="main-button"
          onclick="resetScanner()"
        >

          ERNEUT VERSUCHEN

        </button>

      </div>

    `;

}


/* =================================================
   RESET
================================================= */

function resetScanner() {

  locked = false;

  document
    .getElementById("status")
    .innerHTML = "";

  document
    .getElementById("manual")
    .value = "";

}


/* =================================================
   SICHERHEIT
================================================= */

function escapeHtml(
  value
) {

  return String(
    value
  ).replace(
    /[&<>"']/g,
    function(char) {

      return {

        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"

      }[char];

    }
  );

}


function escapeJs(
  value
) {

  return String(
    value
  )
  .replace(
    /\\/g,
    "\\\\"
  )
  .replace(
    /'/g,
    "\\'"
  );

}


/* =================================================
   START
================================================= */

setTimeout(
  function() {

    startScanner();

  },
  2500
);

</script>

</body>

</html>
