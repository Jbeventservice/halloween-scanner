<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>JB Event Service – Einlass</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  width: 100%;
  max-width: 520px;
  margin: auto;
  padding: 20px;
}

.header {
  text-align: center;
  padding: 15px 0 20px;
}

.logo {
  font-size: 12px;
  letter-spacing: 4px;
  color: #999;
}

h1 {
  margin: 10px 0 5px;
  font-size: 32px;
}

.subtitle {
  color: #888;
}

#reader {
  width: 100%;
  overflow: hidden;
  border-radius: 18px;
  background: #111;
}

.status {
  margin-top: 20px;
  padding: 25px;
  border-radius: 18px;
  background: #151515;
  text-align: center;
}

.green {
  background: #082b17;
  border: 2px solid #18d66b;
}

.red {
  background: #350909;
  border: 2px solid #ff3030;
}

.orange {
  background: #332300;
  border: 2px solid #ffb000;
}

.icon {
  font-size: 55px;
}

.title {
  font-size: 25px;
  font-weight: bold;
  margin: 10px 0;
}

.info {
  color: #ddd;
  line-height: 1.7;
}

button {
  width: 100%;
  padding: 17px;
  margin-top: 18px;
  border: none;
  border-radius: 12px;
  background: #ff6a00;
  color: white;
  font-size: 17px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 16px;
  margin-top: 18px;
  border-radius: 12px;
  border: 1px solid #333;
  background: #111;
  color: white;
  font-size: 16px;
}

.small {
  text-align: center;
  color: #666;
  font-size: 12px;
  margin-top: 25px;
}

</style>
</head>

<body>

<div class="container">

  <div class="header">

    <div class="logo">
      JB EVENT SERVICE
    </div>

    <h1>🎃 EINLASS</h1>

    <div class="subtitle">
      Halloween Party 2026
    </div>

  </div>


  <div id="reader"></div>


  <div
    id="status"
    class="status"
  >

    <div class="icon">
      📷
    </div>

    <div class="title">
      Scanner bereit
    </div>

    <div class="info">
      QR-Code vor die Kamera halten
    </div>

  </div>


  <input
    id="manual"
    type="text"
    placeholder="Ticket-ID manuell eingeben"
  >


  <button onclick="manualCheck()">
    🔎 TICKET PRÜFEN
  </button>


  <div class="small">
    JB Event Service Ticketsystem
  </div>

</div>


<script>

/*************************************************
 * DEINE GOOGLE APPS SCRIPT WEB-APP
 *************************************************/

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyiovw5TRgRqChipAvU5cIvCZ9wSLP69dfOvT_TtBagnDDLj8XjiwUSZERqKZSqQnHF/exec";


let scanner = null;

let scannerRunning = false;

let locked = false;


/*************************************************
 * SCANNER STARTEN
 *************************************************/

function startScanner() {

  scanner =
    new Html5Qrcode(
      "reader"
    );


  scanner
    .start(

      {
        facingMode:
          "environment"
      },

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }
      },

      function(decodedText) {

        if (locked) {
          return;
        }

        locked = true;

        processQR(
          decodedText
        );

      },

      function(errorMessage) {

        // Scanner sucht weiter

      }

    )
    .then(function() {

      scannerRunning = true;

    })
    .catch(function(error) {

      showError(
        "Kamera konnte nicht gestartet werden."
      );

    });
}


/*************************************************
 * QR-CODE VERARBEITEN
 *************************************************/

function processQR(
  text
) {

  let ticketId =
    String(text)
      .trim();


  /*
   * Wenn der QR-Code eine URL enthält
   */

  try {

    const url =
      new URL(text);

    const id =
      url.searchParams.get(
        "id"
      );

    if (id) {

      ticketId = id;

    }

  }
  catch(error) {

    // QR-Code kann direkt eine Ticket-ID sein

  }


  checkTicket(
    ticketId
  );
}


/*************************************************
 * TICKET PRÜFEN
 *************************************************/

function checkTicket(
  ticketId
) {

  ticketId =
    String(ticketId || "")
      .trim()
      .toUpperCase();


  if (!ticketId) {

    showError(
      "Keine Ticket-ID erkannt."
    );

    return;

  }


  showLoading(
    "Ticket wird geprüft …"
  );


  const callbackName =
    "ticketCheck_" +
    Date.now();


  window[callbackName] =
    function(ticket) {

      try {

        displayTicket(
          ticket
        );

      }
      finally {

        delete window[
          callbackName
        ];

      }

    };


  const script =
    document.createElement(
      "script"
    );


  script.src =
    SCRIPT_URL +
    "?action=check" +
    "&id=" +
    encodeURIComponent(
      ticketId
    ) +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      delete window[
        callbackName
      ];

      showError(
        "Google-Ticketsystem nicht erreichbar."
      );

    };


  document.body.appendChild(
    script
  );
}


/*************************************************
 * TICKET ANZEIGEN
 *************************************************/

function displayTicket(
  ticket
) {

  /*
   * NICHT GEFUNDEN
   */

  if (!ticket.found) {

    showError(
      "TICKET NICHT GEFUNDEN"
    );

    return;
  }


  /*
   * BEREITS EINGELÖST
   */

  if (
    ticket.alreadyUsed
  ) {

    document.getElementById(
      "status"
    ).className =
      "status orange";


    document.getElementById(
      "status"
    ).innerHTML = `

      <div class="icon">
        ⚠️
      </div>

      <div class="title">
        BEREITS EINGELÖST
      </div>

      <div class="info">

        <b>
          ${escapeHtml(
            ticket.name
          )}
        </b>

        <br>

        ${escapeHtml(
          ticket.ticketType
        )}

        <br><br>

        Ticket-ID:

        <br>

        <b>
          ${escapeHtml(
            ticket.ticketId
          )}
        </b>

      </div>

      <button
        onclick="resetScanner()"
      >
        NÄCHSTES TICKET
      </button>

    `;

    return;
  }


  /*
   * GÜLTIG
   */

  document.getElementById(
    "status"
  ).className =
    "status green";


  document.getElementById(
    "status"
  ).innerHTML = `

    <div class="icon">
      ✅
    </div>

    <div class="title">
      TICKET GÜLTIG
    </div>

    <div class="info">

      <b>
        ${escapeHtml(
          ticket.name
        )}
      </b>

      <br>

      ${escapeHtml(
        ticket.ticketType
      )}

      <br>

      ${Number(
        ticket.price
      ).toFixed(2)} €

      <br><br>

      Ticket-ID:

      <br>

      <b>
        ${escapeHtml(
          ticket.ticketId
        )}
      </b>

    </div>

    <button
      onclick="redeemTicket(
        '${escapeJs(
          ticket.ticketId
        )}'
      )"
    >
      ✅ EINLASS GEWÄHREN
    </button>

  `;
}


/*************************************************
 * TICKET EINLÖSEN
 *************************************************/

function redeemTicket(
  ticketId
) {

  showLoading(
    "Ticket wird eingelöst …"
  );


  const callbackName =
    "ticketRedeem_" +
    Date.now();


  window[callbackName] =
    function(result) {

      try {

        if (
          result.success
        ) {

          document.getElementById(
            "status"
          ).className =
            "status green";


          document.getElementById(
            "status"
          ).innerHTML = `

            <div class="icon">
              🎉
            </div>

            <div class="title">
              EINLASS GEWÄHRT
            </div>

            <div class="info">

              <b>
                ${escapeHtml(
                  result.name
                )}
              </b>

              <br>

              ${escapeHtml(
                result.ticketType
              )}

              <br><br>

              Ticket wurde erfolgreich
              eingelöst.

            </div>

            <button
              onclick="resetScanner()"
            >
              NÄCHSTES TICKET
            </button>

          `;

        }
        else {

          showError(
            result.message ||
            "Ticket konnte nicht eingelöst werden."
          );

        }

      }
      finally {

        delete window[
          callbackName
        ];

      }

    };


  const script =
    document.createElement(
      "script"
    );


  script.src =
    SCRIPT_URL +
    "?action=redeem" +
    "&id=" +
    encodeURIComponent(
      ticketId
    ) +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      delete window[
        callbackName
      ];

      showError(
        "Google-Ticketsystem nicht erreichbar."
      );

    };


  document.body.appendChild(
    script
  );
}


/*************************************************
 * MANUELLE TICKET-ID
 *************************************************/

function manualCheck() {

  const value =
    document.getElementById(
      "manual"
    ).value;


  checkTicket(
    value
  );
}


/*************************************************
 * LADEN
 *************************************************/

function showLoading(
  message
) {

  document.getElementById(
    "status"
  ).className =
    "status";


  document.getElementById(
    "status"
  ).innerHTML = `

    <div class="icon">
      ⏳
    </div>

    <div class="title">
      ${escapeHtml(
        message
      )}
    </div>

  `;
}


/*************************************************
 * FEHLER
 *************************************************/

function showError(
  message
) {

  document.getElementById(
    "status"
  ).className =
    "status red";


  document.getElementById(
    "status"
  ).innerHTML = `

    <div class="icon">
      ❌
    </div>

    <div class="title">
      ${escapeHtml(
        message
      )}
    </div>

    <button
      onclick="resetScanner()"
    >
      ERNEUT VERSUCHEN
    </button>

  `;

}


/*************************************************
 * SCANNER ZURÜCKSETZEN
 *************************************************/

function resetScanner() {

  location.reload();

}


/*************************************************
 * SICHERHEIT
 *************************************************/

function escapeHtml(
  value
) {

  return String(
    value
  ).replace(
    /[&<>"']/g,
    function(char) {

      return {

        "&":
          "&amp;",

        "<":
          "&lt;",

        ">":
          "&gt;",

        '"':
          "&quot;",

        "'":
          "&#039;"

      }[char];

    }
  );

}


function escapeJs(
  value
) {

  return String(
    value
  )
  .replace(
    /\\/g,
    "\\\\"
  )
  .replace(
    /'/g,
    "\\'"
  );

}


/*************************************************
 * START
 *************************************************/

startScanner();

</script>

</body>
</html>
